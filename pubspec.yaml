name: theadbook_player
description: theadbook Player — Xibo digital signage player for Android phones, tablets, TV, and foldables
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.7.0
  xml: ^6.5.0
  web_socket_channel: ^3.0.1
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.3
  crypto: ^3.0.5
  wakelock_plus: ^1.2.10
  uuid: ^4.5.1
  socket_io_client: ^2.0.3+1
  disk_space_2: ^1.0.12
  flutter_presentation_display: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
